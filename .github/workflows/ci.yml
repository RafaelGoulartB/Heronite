name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/screenshots/**", "docs/**", "licenses/**"]
  pull_request:
    paths-ignore: ["**.md", "assets/screenshots/**", "docs/**", "licenses/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster builds and a smaller cache. Backtraces still
  # name the functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read main's cache but do not save their own, so the
          # 10 GB cache quota is not filled with short-lived entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Keep the Windows port building: the same clippy and tests on Windows
  # (formatting is the same on both, the Linux job checks it). Clippy and the
  # tests are two jobs so they run side by side: the test build is the long
  # one, and clippy's checking shares nothing with it.
  windows-clippy:
    name: Clippy (Windows)
    runs-on: windows-latest
    env:
      # lld links several times faster than link.exe (build scripts and
      # proc macros here). .cargo/config.toml does the same on Linux.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-tests:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # With link.exe, linking the ~55 test programs took about half of the
      # test build. Releases still link with link.exe (scripts/windows/package.ps1).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --no-fail-fast
