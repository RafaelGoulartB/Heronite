name: Release

# A release starts in one of three ways:
# - a pull request merged into main with a `release:patch`, `release:minor` or
#   `release:major` label: the version in Cargo.toml is bumped, committed to
#   main and tagged;
# - "Run workflow" in the Actions tab, picking the bump (for work pushed
#   straight to main);
# - pushing a `vX.Y.Z` tag by hand (Cargo.toml must already have X.Y.Z).
# Then, from the tag and side by side, the AppImage and the .deb / .rpm / Arch
# packages are built and checked on clean containers (job appimage), the
# Flatpak bundle is built (job flatpak), and the Windows installer and
# portable zip are built and checked (job windows).
# The publish job gathers them, signs the files the in-app updater installs
# (secret MINISIGN_SECRET_KEY, see scripts/sign-release.sh; Flatpak updates
# the Flatpak) and publishes them as one GitHub release.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    # Merged pull requests only, and only with a release label.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.pull_request.merged == true && (
          contains(github.event.pull_request.labels.*.name, 'release:patch') ||
          contains(github.event.pull_request.labels.*.name, 'release:minor') ||
          contains(github.event.pull_request.labels.*.name, 'release:major')))
    outputs:
      tag: ${{ steps.out.outputs.tag }}
    steps:
      # Always main (or the pushed tag), never the pull request's own code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
      - name: Bump, commit and tag
        if: github.event_name != 'push'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            BUMP="$INPUT_BUMP"
          elif grep -q '"release:major"' <<<"$LABELS"; then BUMP=major
          elif grep -q '"release:minor"' <<<"$LABELS"; then BUMP=minor
          else BUMP=patch
          fi
          VERSION=$(scripts/bump-version.py "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Check the pushed tag
        if: github.event_name == 'push'
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$CARGO" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - id: out
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  appimage:
    name: AppImage and packages (x86_64)
    needs: version
    # The oldest supported Ubuntu: the AppImage runs on systems with this
    # glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p heronite -p heronite-epic-login
      - name: appimagetool and nfpm
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # zsyncmake writes the .zsync of the update information; patchelf
          # points the app at the libraries the AppImage bundles. bison,
          # ninja and meson build its libxkbcommon (scripts/xkbcommon.sh).
          sudo apt-get install -y --no-install-recommends zsync patchelf bison ninja-build
          pipx install 'meson>=1.4'
          # nfpm builds the .deb, .rpm and Arch packages (pinned build).
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/appimage.sh
      - name: System packages
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/packages.sh "${TAG#v}"
      # Installs each package on clean Ubuntu 22.04 / 24.04, Debian 12,
      # Fedora and Arch containers: a wrong dependency name fails here. Runs
      # the AppImage on containers with only glibc and libxcb: a library it
      # should bundle fails here.
      - name: Check the packages
        run: scripts/package-smoke.sh
      # Not signed yet: the publish job signs them with the Windows files.
      - uses: actions/upload-artifact@v4
        with:
          name: Heronite-linux
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (x86_64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: flatpak-builder
        run: scripts/ci-flatpak-deps.sh
      # The downloads (crates, the tools' sources) and the tools' builds.
      - uses: actions/cache@v4
        with:
          path: target/flatpak/state
          key: flatpak-${{ hashFiles('packaging/flatpak/com.heronite.rs.yml', 'Cargo.lock') }}
          restore-keys: flatpak-
      - name: Build
        run: scripts/flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Heronite-flatpak
          path: dist/Heronite-x86_64.flatpak
          if-no-files-found: error

  windows:
    name: Windows installer and portable zip (x86_64)
    needs: version
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.cert.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        run: |
          # Preinstalled on windows-latest (6.7.1 on the Windows Server 2025
          # image); the pinned official installer if an image drops it.
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ((Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or ($known | Where-Object { Test-Path $_ })) {
            Write-Host 'Inno Setup is installed'
            exit 0
          }
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0') { throw "Inno Setup installer checksum mismatch: $hash" }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer failed ($($p.ExitCode))" }
      # Authenticode, once there is a certificate: the secrets
      # WINDOWS_SIGN_PFX_BASE64 (a base64 .pfx) and WINDOWS_SIGN_PASSWORD
      # sign heronite-rs.exe, heronite-epic-login.exe, the setup and its
      # uninstaller (see scripts/windows/sign.ps1, which also takes a
      # WINDOWS_SIGN_COMMAND, for Azure Trusted Signing for example).
      # Without them nothing is signed and the release notes warn about
      # SmartScreen.
      - name: Code signing certificate
        id: cert
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host 'No WINDOWS_SIGN_PFX_BASE64 secret: the Windows files are not Authenticode-signed.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'heronite-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "WINDOWS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Package
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./scripts/windows/package.ps1 -Version $env:TAG.Substring(1)
      # The zip's layout and its login window (--smoke); a silent install,
      # an update over it with /WAITPID and a silent uninstall on the runner.
      - name: Check the packages
        run: ./scripts/windows/smoke.ps1
      # Not minisign-signed yet: the publish job signs them with the Linux
      # files.
      - uses: actions/upload-artifact@v4
        with:
          name: Heronite-windows
          path: |
            dist/Heronite-Setup-x86_64.exe
            dist/Heronite-Portable-x86_64.zip
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [version, appimage, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          # The release notes read the history back to the previous tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Heronite-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Heronite-flatpak
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Heronite-windows
          path: dist
      - name: minisign
        run: |
          # minisign signs the files for the in-app updater (pinned build).
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          sudo install -m755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
      # The in-app updater only installs files signed with the key whose
      # public half is built into the app (crates/update/src/lib.rs).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for f in Heronite-x86_64.AppImage Heronite-x86_64.flatpak Heronite-Setup-x86_64.exe Heronite-Portable-x86_64.zip; do
            [[ -f dist/$f ]] || { echo "::error::dist/$f is missing"; exit 1; }
          done
          scripts/sign-release.sh "${TAG#v}" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Heronite-release
          path: dist/*
          overwrite: true
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          # cliff.toml groups the commits since the previous tag by type
          # (feat, fix, perf...). The first release has no previous tag, so it
          # gets a short note instead of the whole development history.
          # A short guide to the assets goes first: the .minisig and .zsync
          # files sit next to the downloads but are only for the updaters.
          cat > notes.md <<'EOF'
          **Linux:** `Heronite-x86_64.AppImage` runs on any distribution (recommended). Or the package for your system: `.deb` (Debian, Ubuntu, Mint), `.rpm` (Fedora, openSUSE), `.pkg.tar.zst` (Arch, CachyOS), or `Heronite-x86_64.flatpak` (`flatpak install --user ./Heronite-x86_64.flatpak`; Windows games also need `flatpak install --user flathub org.freedesktop.Platform.Compat.i386//26.08 org.freedesktop.Platform.GL32.default//26.08`).

          **Windows 10 and 11:** `Heronite-Setup-x86_64.exe` installs Heronite for your user, no administrator rights needed (recommended). `Heronite-Portable-x86_64.zip` runs from any folder you extract it to and keeps its library and settings in that folder.
          EOF
          # Until the Windows files are code-signed (see the windows job).
          if [[ $WINDOWS_SIGNED != true ]]; then
            truncate -s -1 notes.md
            printf ' They are not code-signed yet, so Windows SmartScreen may say "Windows protected your PC": choose **More info**, then **Run anyway**.\n' >> notes.md
          fi
          printf '\nThe `.minisig` and `.zsync` files are for the updaters; you do not need them.\n\n' >> notes.md
          if [[ $(git tag --list 'v*' | wc -l) -le 1 ]]; then
            printf 'First public release of Heronite. See the [README](https://github.com/RafaelGoulartB/Heronite#readme) for what it can do.\n' >> notes.md
          else
            git cliff --latest --strip all >> notes.md
          fi
          # Last line: a star and the Discussions, where feedback goes.
          printf '\n**Enjoying Heronite?** [Star it on GitHub](https://github.com/RafaelGoulartB/Heronite) and share your feedback and ideas in [Discussions](https://github.com/RafaelGoulartB/Heronite/discussions).\n' >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "Heronite $TAG" --notes-file notes.md
