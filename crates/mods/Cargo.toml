[package]
name = "heronite-mods"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-game mods: install, load order, fuse-overlayfs layers, Nexus Mods, Thunderstore, FOMOD"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-installer = { path = "../installer" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
ureq = "3"
sha2 = "0.10"
roxmltree = "0.21"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
