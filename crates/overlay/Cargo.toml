[package]
name = "heronite-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-game overlay backend for Heronite: controller input (Guide button, grabs), system audio, controller status and the replay buffer"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
