[package]
name = "heronite-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-game overlay backend for Heronite: controller input (Guide button, grabs), system audio, controller status, media players and the replay buffer"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
# A player's cover sent as a `data:` URI (mpv), kept as a file (`media`).
base64 = "0.22"
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
# `_NET_ACTIVE_WINDOW` for "Back to game" on X11 (`game_window`); GPUI builds
# it on Linux already.
x11rb = { version = "0.13", default-features = false }
# The media players' MPRIS (`media`). Already in the tree through ashpd;
# blocking, because the panel reads them off the UI thread.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
heronite-platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
