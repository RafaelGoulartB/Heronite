[package]
name = "heronite-emulation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ROM scanning, emulator manager, disc ids, save states, Ludusavi and config backups, compatible with Heronite's data files"

[dependencies]
heronite-data = { path = "../data" }
heronite-launch = { path = "../launch" }
heronite-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
