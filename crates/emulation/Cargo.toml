[package]
name = "heronite-emulation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ROM scanning, emulator manager, disc ids, save states, Ludusavi backups, compatible with Heronite's data files"

[dependencies]
heronite-data = { path = "../data" }
heronite-launch = { path = "../launch" }
heronite-platform = { path = "../platform" }
heronite-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
# Windows' Documents and AppData folders (known folders, not variables).
dirs = "6"

[features]
# Opt-in tests against real data, real tools or the network, and benchmarks:
# `cargo test -p heronite-emulation --features manual-tests --test <name>`. Off by
# default so CI does not build and link binaries that would skip anyway.
manual-tests = []

[dev-dependencies]
tempfile = "3"

[[test]]
name = "real_data"
required-features = ["manual-tests"]

[[test]]
name = "real_restore"
required-features = ["manual-tests"]

[[test]]
name = "real_windows"
required-features = ["manual-tests"]

[lints]
workspace = true
