[package]
name = "heronite-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Installs games from YAML install scripts into the Collection as local games"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-launch = { path = "../launch" }
heronite-emulation = { path = "../emulation" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
anyhow = "1"
log = "0.4"
shlex = "1"
ureq = "3"
md-5 = "0.10"
sha1_smol = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
