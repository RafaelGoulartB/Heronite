[package]
name = "heronite-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What differs between operating systems: processes, files, folders and the features each one has"

[dependencies]
log.workspace = true
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Notification portal, for the Flatpak (`flatpak::notify`).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification"] }
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Controllers of every kind for console mode (`controllers`): SDL's own
# drivers read PlayStation and Nintendo controllers, which XInput does not
# know and Windows.Gaming.Input loses once Steam switches their report mode.
# Built from source and linked statically with only the joystick parts (no
# video, audio or GPU), so there is no SDL3.dll to ship.
sdl3-sys = { version = "=0.7.2", default-features = false, features = [
    "build-from-source-static",
    "no-default-subsystems",
    "sdl-joystick",
    "sdl-hidapi",
] }
# COM interfaces (`.lnk` shortcuts through the shell's ShellLink, DXGI's
# graphics adapters for the GPU preference).
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The `#[interface]` macro of `windows` expands to `::windows_core` paths: the
# undocumented IPolicyConfig (default audio device, `audio::set_default_device`).
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

# Its own main: it starts itself again as the programs it stops.
[[test]]
name = "stop_helper"
harness = false

[lints]
workspace = true
