[package]
name = "heronite-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
dirs = "6"
heronite-i18n = { path = "../i18n" }
heronite-platform = { path = "../platform" }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
indexmap = { version = "2", features = ["serde"] }
rusty-leveldb = "4"
tempfile = "3"
icu_collator = "2"
unicode-normalization = "0.1"
base64 = "0.22"
getrandom = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Helpers for other crates' tests (`testing`): their `[dev-dependencies]` turn it on.
testing = []
# Opt-in tests against real data, real tools or the network, and benchmarks:
# `cargo test -p heronite-data --features manual-tests --test <name>`. Off by
# default so CI does not build and link binaries that would skip anyway.
manual-tests = []

[dev-dependencies]

[[test]]
name = "real_collection"
required-features = ["manual-tests"]

[[test]]
name = "stats_scale"
required-features = ["manual-tests"]

[lints]
workspace = true
