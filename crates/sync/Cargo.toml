[package]
name = "heronite-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The library synced between PCs: each PC's own file in a shared folder or a cloud account (rclone), merged without losing anything"

[dependencies]
heronite-backup = { path = "../backup" }
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-metadata = { path = "../metadata" }
heronite-platform = { path = "../platform" }
heronite-launch = { path = "../launch" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
