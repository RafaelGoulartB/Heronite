[package]
name = "heronite-epic-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epic Games Store protocol: sign-in, library and catalog, manifests and chunks, launch sign-in, cloud saves"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
ureq = "3"
flate2 = "1"
sha1_smol = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
percent-encoding = "2"
# Manifests and chunks of newer builds are AES-GCM encrypted (manifest version 22+).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
