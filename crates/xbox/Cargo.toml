[package]
name = "heronite-xbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Microsoft Store and PC Game Pass games the Xbox app installs on Windows: finding them and keeping them in the Collection"

[dependencies]
heronite-data = { path = "../data" }
heronite-platform = { path = "../platform" }
serde_json.workspace = true
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Already built for the SVG icons (usvg).
roxmltree = "0.21"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
