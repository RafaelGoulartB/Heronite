[package]
name = "heronite-backup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backups of the data folder and the app settings: incremental snapshots, retention and restore"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"

[features]
# Opt-in tests against real data, real tools or the network, and benchmarks:
# `cargo test -p heronite-backup --features manual-tests --test <name>`. Off by
# default so CI does not build and link binaries that would skip anyway.
manual-tests = []

[dev-dependencies]
tempfile = "3"

[[test]]
name = "real_data"
required-features = ["manual-tests"]

[lints]
workspace = true
