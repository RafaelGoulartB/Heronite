[package]
name = "heronite-launch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game launching, playtime tracking and session recording compatible with Heronite's data files"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
shlex = "1"
libc = "0.2"
regex = "1"
ureq = "3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
