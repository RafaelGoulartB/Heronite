[package]
name = "heronite-epic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epic Games Store through legendary (login, library, install, update, cloud saves) compatible with Heronite's data files"

[dependencies]
heronite-data = { path = "../data" }
heronite-launch = { path = "../launch" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
