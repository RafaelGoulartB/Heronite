[package]
name = "heronite-epic-login"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small helper window (wry: WebKitGTK on Linux, WebView2 on Windows) that logs in to Epic Games, GOG or Amazon Games and prints the authorization code; kept out of the main binary so the GPUI app stays small"

[[bin]]
name = "heronite-epic-login"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
gtk = "0.18"

# A plain Win32 window holding WebView2 (wry's Windows backend).
[target.'cfg(windows)'.dependencies]
# (os-webview only adds `webview_version` there: the runtime check.)
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
heronite-platform = { path = "../platform" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
