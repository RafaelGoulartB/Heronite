[package]
name = "heronite-epic-login"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small helper window (wry + GTK WebKit) that logs in to Epic Games and prints the authorization code; kept out of the main binary so the GPUI app stays small"

[[bin]]
name = "heronite-epic-login"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
gtk = "0.18"

[lints]
workspace = true
