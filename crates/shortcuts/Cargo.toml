[package]
name = "heronite-shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop / application-menu shortcuts and Steam non-Steam shortcuts (shortcuts.vdf) compatible with Heroic"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-platform = { path = "../platform" }
anyhow = "1"
log = "0.4"
dirs = "6"
serde_json.workspace = true

[features]
# `steam_client::testing`: a fake Steam debugger for other crates' tests.
test-support = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
