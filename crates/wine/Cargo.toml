[package]
name = "heronite-wine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wine/Proton manager (download, install, remove) and compatibility layer detection compatible with Heronite's data files"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
dirs = "6"
parking_lot = "0.12"
ureq = "3"
sha2 = "0.10"
trash = "5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
