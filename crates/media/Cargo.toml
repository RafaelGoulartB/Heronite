[package]
name = "heronite-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collection screenshots backend for Heronite: folder matching, listing, thumbnails, trash and capture"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-images = { path = "../images" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
regex = "1"
sha2 = "0.10"
# Same line as heronite-images (JPEG encode for the cache, decode of cached previews).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Lossless WebP encoding of the captures (`compress`): libwebp, built from its
# vendored sources. `png` reads the chunks `image` does not expose.
libwebp-sys = "0.14"
png = "0.18"
crc32fast = "1"
trash = "5"
sanitize-filename = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-channel = "0.3"
pollster = "0.4"
signal-hook = "0.3"
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
heronite-platform = { path = "../platform" }
# Desktop Duplication (DXGI / Direct3D 11) captures, the `RegisterHotKey`
# thread, the on-screen notice and the HDR white level (DisplayConfig).
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
notify-rust = "4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
