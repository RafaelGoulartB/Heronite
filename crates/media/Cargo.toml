[package]
name = "heronite-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collection screenshots backend for Heronite: folder matching, listing, thumbnails, trash and capture"

[dependencies]
heronite-data = { path = "../data" }
heronite-images = { path = "../images" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
regex = "1"
sha2 = "0.10"
# Same line as heronite-images (JPEG encode for the cache, decode of cached previews).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
trash = "5"
sanitize-filename = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-channel = "0.3"
pollster = "0.4"
signal-hook = "0.3"
notify-rust = "4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
