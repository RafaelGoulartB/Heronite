[package]
name = "heronite-metadata-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metadata sources the community writes: manifest, package, sandboxed script runtime (QuickJS)"

[dependencies]
heronite-data = { path = "../data" }
heronite-platform = { path = "../platform" }
heronite-metadata = { path = "../metadata" }
# The public-only resolver every request and picture of an extension goes
# through (`heronite_images::public`).
heronite-images = { path = "../images" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
url = "2"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
toml = "0.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
semver = "1"
dom_query = { version = "0.27", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
