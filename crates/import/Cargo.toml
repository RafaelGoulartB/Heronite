[package]
name = "heronite-import"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Games of the other Linux launchers (Heroic, Lutris, Bottles, Faugus) brought into the Collection"

[dependencies]
heronite-data = { path = "../data" }
heronite-platform = { path = "../platform" }
# The details of a game brought over from Playnite (its metadata candidate).
heronite-metadata = { path = "../metadata" }
anyhow = "1"
log = "0.4"
serde_json.workspace = true
# Bottles keeps its bottles' settings and Library in YAML.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Lutris keeps its library in SQLite; the library is compiled in (no system
# libsqlite3 needed by the packages or the AppImage).
rusqlite = { version = "0.40", features = ["bundled"] }
# Playnite's built-in emulator profiles name their program by a pattern.
regex = "1"
# Faugus' launch arguments are a shell line.
shlex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
