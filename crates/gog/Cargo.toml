[package]
name = "heronite-gog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GOG store through gogdl and the GOG web APIs (login, library, install, update, first-launch setup)"

[dependencies]
heronite-data = { path = "../data" }
heronite-platform = { path = "../platform" }
heronite-i18n = { path = "../i18n" }
heronite-launch = { path = "../launch" }
heronite-epic = { path = "../epic" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"
ureq = "3"

# Windows' own save folders (Saved Games, AppData...).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

[dev-dependencies]
heronite-data = { path = "../data", features = ["testing"] }
tempfile = "3"

[lints]
workspace = true
