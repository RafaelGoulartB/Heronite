[package]
name = "heronite-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-update of the Heronite AppImage: GitHub release check, signed download and in-place swap"

[dependencies]
heronite-data = { path = "../data" }
heronite-i18n = { path = "../i18n" }
heronite-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
minisign-verify = "0.2"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
