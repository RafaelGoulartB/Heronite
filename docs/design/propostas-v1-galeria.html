<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>HeroniteRust — propostas de design v1 (galeria)</title><style>
body{margin:0 auto;max-width:1300px;padding:24px;font-family:system-ui,sans-serif;background:#0a0c10;color:#e6e9ef}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid #2a2f38;background:transparent;color:#e6e9ef;cursor:pointer}
.tabs button.on{background:#e6e9ef;color:#111}
h2{margin:0 0 6px}h2 span{font-weight:400;font-size:15px;color:#9aa3b2;margin-left:8px}
p{line-height:1.5;margin:4px 0}.eff{color:#9aa3b2;font-size:14px}
.cap{font-size:13px;color:#9aa3b2;margin:18px 0 6px}img{width:100%;display:block;border-radius:10px}
</style></head><body><div class="tabs" id="t"></div><div id="v"></div><script>
const O=[
["1 · Vidro","painéis translúcidos sobre a arte do jogo","Vidro fosco sobre a arte, combinando com a Collection. O menu ☰ vira uma grade de blocos com informação ao vivo. As configurações do jogo abrem numa <b>gaveta lateral</b>, com o jogo ainda visível atrás. Usa interruptores, abas em pílula e cantos bem arredondados.","Esforço: médio. O GPUI não borra o fundo atrás de um painel, então o efeito usa uma cópia já borrada da arte."],
["2 · Console","modo TV / Steam Deck","Letras grandes, uma linha focada por vez, valores trocados com ◀ ▶ e dicas de botão do controle (A, B, LB/RB). O menu vira uma <b>barra lateral de altura total</b>. As configurações do jogo ocupam a tela toda, com a arte no topo.","Esforço: médio-alto. Exige foco e navegação por teclado e controle em todas as telas."],
["3 · Comando","denso e feito para teclado","O menu ☰ vira uma <b>paleta de comandos</b> (Ctrl K) que procura páginas, ações e jogos. As configurações são uma lista densa com busca, com um ponto marcando o que difere do padrão, e uma barra de status mostra onde salvou.","Esforço: baixo-médio. Só a paleta e a busca são novas."],
["4 · Editorial","limpo, no estilo dos ajustes do macOS e iOS","Superfícies sólidas e listas agrupadas: rótulo à esquerda, interruptor ou valor com › à direita. Títulos grandes e cor de destaque usada com parcimônia. O menu é um dropdown com seções e atalhos, e as configurações do jogo abrem num modal centralizado.","Esforço: baixo. É o mais direto de implementar e manter."],
["5 · Imersivo","a arte e a cor do jogo comandam","O menu ☰ vira um <b>painel com cartões ao vivo</b>. As configurações globais têm um banner e grupos em cartões. As do jogo viram uma <b>página inteira</b>, com a arte à esquerda e a cor de destaque tirada da arte.","Esforço: alto. Exige extrair a cor da arte e montar layouts maiores."]];
const C=["Menu ☰","Configurações globais","Configurações do jogo (aba Wine)"],t=document.getElementById('t'),v=document.getElementById('v');
function show(i){const[o,s,d,e]=O[i],k='propostas-v1-telas/o'+(i+1);
v.innerHTML=`<h2>${o}<span>${s}</span></h2><p>${d}</p><p class="eff">${e}</p><div class="cap">Componentes</div><img src="${k}-kit.jpg">`+C.map((c,j)=>`<div class="cap">${c}</div><img src="${k}-${j}.jpg">`).join('');
[...t.children].forEach((b,j)=>b.classList.toggle('on',i===j));}
O.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=()=>show(i);t.appendChild(b);});show(0);
</script></body></html>
