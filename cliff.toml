# Release notes from the commit history (https://git-cliff.org).
# Commits follow Conventional Commits; only the user-facing types are listed.
#   git cliff --latest     notes of the newest tag
#   git cliff --unreleased what the next release would say

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/RafaelGoulartB/Heronite/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^ui", group = "<!-- 3 -->🎨 Interface" },
  { message = "^docs", group = "<!-- 4 -->📖 Documentation" },
  { message = "^revert", group = "<!-- 5 -->⏪ Reverted" },
  { body = ".*security", group = "<!-- 6 -->🔒 Security" },
  { message = ".*", skip = true },
]
