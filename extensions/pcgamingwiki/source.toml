# PCGamingWiki as a metadata source: what the wiki knows of a PC game's
# features (controllers, ultra-wide screens, HDR, ray tracing) and its series.
id = "pcgamingwiki"
name = "PCGamingWiki"
version = "1.0.0"
api = 1
author = "Heronite"
homepage = "https://www.pcgamingwiki.com"
kind = "extras"
description = "Controller support, ultra-wide screens, HDR and ray tracing of PC games, and their series, from PCGamingWiki. Found by the Steam id when the game has one, else by its name."

[provides]
fields = ["series", "features"]

[applies]
# A wiki of PC games: an emulated game is not asked.
to = "pc"

[network]
hosts = ["www.pcgamingwiki.com"]
rate = "2/s"
