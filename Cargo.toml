[workspace]
resolver = "2"
members = ["app", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
gpui-kit = { version = "=0.7.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# GPUI callbacks (`Rc<dyn Fn(.., &mut Window, &mut App)>`) and builder-style
# render helpers trip these on nearly every view.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
