[package]
name = "heronite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "heronite-rs"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
# The interface scale every window opens at (Settings → Appearance).
gpui-zoom = { path = "../vendor/gpui-zoom" }
anyhow.workspace = true
log.workspace = true
rust-embed = "8"
heronite-achievements = { path = "../crates/achievements" }
heronite-backup = { path = "../crates/backup" }
heronite-sync = { path = "../crates/sync" }
heronite-clients = { path = "../crates/clients" }
heronite-data = { path = "../crates/data" }
heronite-display = { path = "../crates/display" }
heronite-i18n = { path = "../crates/i18n" }
heronite-images = { path = "../crates/images" }
heronite-launch = { path = "../crates/launch" }
heronite-metadata = { path = "../crates/metadata" }
heronite-metadata-ext = { path = "../crates/metadata-ext" }
serde_json.workspace = true
heronite-media = { path = "../crates/media" }
heronite-platform = { path = "../crates/platform" }
heronite-overlay = { path = "../crates/overlay" }
heronite-emulation = { path = "../crates/emulation" }
heronite-import = { path = "../crates/import" }
heronite-installer = { path = "../crates/installer" }
heronite-wine = { path = "../crates/wine" }
heronite-epic = { path = "../crates/epic" }
heronite-gog = { path = "../crates/gog" }
heronite-amazon = { path = "../crates/amazon" }
heronite-update = { path = "../crates/update" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
smallvec = "1"
indexmap = "2"
libc = "0.2"
signal-hook = "0.3"
futures = "0.3"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
heronite-shortcuts = { path = "../crates/shortcuts" }
heronite-steam = { path = "../crates/steam" }
# The QR code of the Steam sign-in.
qrcodegen = "1.8"
heronite-xbox = { path = "../crates/xbox" }
heronite-storage = { path = "../crates/storage" }
heronite-sunshine = { path = "../crates/sunshine" }
dirs = "6"
notify = "8"
notify-rust = "4"
shlex = "1"

# Controllers for console mode. Windows reads them through SDL instead
# (heronite-platform's `controllers`).
[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# Hiding and showing the cursor (console mode), which GPUI has no API for.
gpui-pre-linux = "=0.3.8"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "=0.3.8"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
