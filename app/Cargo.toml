[package]
name = "heronite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "heronite-rs"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
rust-embed = "8"
heronite-data = { path = "../crates/data" }
heronite-i18n = { path = "../crates/i18n" }
heronite-images = { path = "../crates/images" }
heronite-launch = { path = "../crates/launch" }
heronite-metadata = { path = "../crates/metadata" }
serde_json.workspace = true
heronite-media = { path = "../crates/media" }
heronite-emulation = { path = "../crates/emulation" }
heronite-wine = { path = "../crates/wine" }
heronite-epic = { path = "../crates/epic" }
heronite-gog = { path = "../crates/gog" }
heronite-amazon = { path = "../crates/amazon" }
heronite-update = { path = "../crates/update" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
smallvec = "1"
libc = "0.2"
signal-hook = "0.3"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
heronite-shortcuts = { path = "../crates/shortcuts" }
dirs = "6"
notify-rust = "4"
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
